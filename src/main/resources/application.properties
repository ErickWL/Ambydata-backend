# =============================================
# CONFIGURAÇÕES DO SERVIDOR
# =============================================

# Porta em que a aplicação vai rodar (padrão: 8080)
server.port=22441

# Nome da aplicação (usado em logs, monitoramento, etc.)
spring.application.name=ambydata-backend


# =============================================
# BANCO DE DADOS (Configurado para o Aiven Cloud)
# =============================================

# URL de conexão com o MySQL na nuvem (Porta 22441 e SSL ativado obrigatório pelo Aiven)
spring.datasource.url=jdbc:mysql://ambydata-mysql-323799d7-ambydata-project.g.aivencloud.com:22441/defaultdb?useSSL=true&requireSSL=true

# Usuário padrão do Aiven
spring.datasource.username=avnadmin

# Senha do banco de dados
spring.datasource.password=AVNS_BT4orWNvROB6Nw_HBtR

# Driver oficial do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =============================================
# JPA / HIBERNATE
# =============================================

# Dialeto específico para o MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Estratégia de criação/atualização das tabelas:
# update = atualiza o schema sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update

# Exibe as queries SQL geradas pelo Hibernate no console
spring.jpa.show-sql=true

# Formata o SQL exibido no console para melhor legibilidade
spring.jpa.properties.hibernate.format_sql=true